<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35" />

  <!-- Golden Coin -->
  <circle cx="32" cy="32" r="22" fill="url(#coinGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#CA8A04" stroke-width="1.8" stroke-dasharray="3 2.5"/>

  <!-- Rupiah Symbol Rp -->
  <text x="32" y="39" font-family="'Fredoka', 'Quicksand', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#713F12" text-anchor="middle">Rp</text>

  <!-- Sparkle Star in Top-Right -->
  <path d="M51 9 L52.5 13.5 L57 15 L52.5 16.5 L51 21 L49.5 16.5 L45 15 L49.5 13.5 Z" fill="#FFFFFF"/>
</svg>
